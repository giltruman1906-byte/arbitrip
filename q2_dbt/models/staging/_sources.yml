version: 2

# Sources = the raw tables staging reads. Only staging touches raw; marts read staging via ref().
sources:
  - name: raw
    description: >
      Raw ingested tables. In prod these are landed by the backend or a managed connector; here
      they're simulated by seeds (seeds/_seeds.yml) so the project runs. Staging reads them via
      source() so the SQL matches prod.
    # In BigQuery, database: = GCP project and schema: = dataset. database: is omitted so dbt uses
    # the project from profiles.yml — fine here since the seeds live in the same project. In prod
    # raw usually lands in a separate project, so you'd set database: explicitly or dbt won't find it.
    schema: raw
    # These tests check the raw feed is well-formed before any model runs, so a failure here means
    # "the upstream feed is broken", not "my SQL is wrong". Run with: dbt test --select source:raw.
    # In prod I'd also add a freshness: block to catch a feed that silently stopped landing.
    tables:
      - name: raw_payments
        description: Payment-provider interactions; one payment spans 2-3 rows (initiation -> callback -> resolution).
        columns:
          - name: id
            description: Unique per interaction, always populated. The row grain key.
            tests:
              # grain contract at the source — a duplicate/blank id is wrong before staging even runs
              - unique
              - not_null
          - name: payment_id
            description: Provider-assigned payment id; NULL until the provider responds at callback.
            # no not_null here — it's legitimately null/'' at initiation. the conditional not_null
            # (action != 'initiation') lives on the staging model, where the rule actually applies.
          - name: reservation_id
            description: Reservation the interaction belongs to; always populated.
            tests:
              # every interaction must belong to a reservation; a null means orphaned revenue
              - not_null
      - name: raw_reservations
        description: >
          Daily snapshot of active reservations — overwritten nightly in prod (no history).
          Here we keep multiple snapshot_dates so transitions can be reconstructed downstream.
        columns:
          - name: reservation_id
            description: Reservation identity.
            tests:
              # snapshot rows must identify their reservation, or the transition logic can't group
              - not_null
          - name: snapshot_date
            description: The calendar day this snapshot row represents.
            tests:
              - not_null
        # grain = one row per (reservation_id, snapshot_date). if a day's snapshot held a reservation
        # twice, the window logic in stg_reservations would see phantom transitions.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - reservation_id
                - snapshot_date
