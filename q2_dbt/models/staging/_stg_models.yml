version: 2

# Staging-layer tests. dbt keys these by the name: below, not the filename.
# Each has a short note on why it matters downstream. error = breaks revenue or the pipeline;
# warn = something worth a look that can still happen in normal operation.

models:
  - name: stg_payments
    description: One row per payment-provider interaction. Grain = payment_event_id.
    columns:

      - name: payment_event_id
        description: Row grain key (raw `id`).
        tests:
          # grain key — a dupe here double-counts revenue everywhere downstream
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: reservation_id
        description: Reservation the payment belongs to.
        tests:
          # orphan payment can't roll up to a company, so it goes missing from company revenue
          - not_null:
              config:
                severity: error
          # warn, not error: a payment can arrive before its reservation shows up in a snapshot
          # (or after it dropped). res_104 / res_107 trip this on purpose.
          - relationships:
              to: ref('stg_reservations')
              field: reservation_id
              config:
                severity: warn

      - name: status
        description: Interaction status.
        tests:
          # an unknown status just falls out of the fct_payments filters -> understated revenue, no error
          - accepted_values:
              values: ['pending', 'processing', 'succeeded', 'failed', 'refunded']
              config:
                severity: error

      - name: action
        description: Lifecycle stage of the interaction.
        tests:
          # same idea; this one protects the final-status logic
          - accepted_values:
              values: ['initiation', 'callback', 'resolution']
              config:
                severity: error

      - name: amount_usd
        description: Interaction amount (NUMERIC).
        tests:
          # negative / junk amounts corrupt every revenue sum
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                severity: error

      - name: payment_id
        description: Provider payment id; NULL only at initiation.
        tests:
          # by callback the provider should have assigned an id. a null past initiation means the
          # integration is off — worth investigating, not pipeline-stopping, so warn.
          - not_null:
              config:
                where: "action != 'initiation'"
                severity: warn

  - name: stg_reservations
    description: >
      SCD Type-2 status history from daily snapshots — one row per status interval
      [valid_from, valid_to) with an is_current flag. Grain = (reservation_id, valid_from).
    columns:
      - name: reservation_id
        description: Reservation identity. Not unique here — one row per transition.
        tests:
          - not_null
      - name: new_status
        description: Status the reservation entered at valid_from.
        tests:
          - not_null
          # unknown states would break funnel / cancellation analysis
          - accepted_values:
              values: ['pending', 'approved', 'completed', 'pending_cancellation', 'cancelled']
      - name: valid_from
        description: Day this status was first observed (interval start). Date precision only.
        tests:
          - not_null
      - name: valid_to
        description: >
          Day the next transition was observed (interval end, exclusive). NULL = current status,
          so it's intentionally nullable — no not_null test.
      - name: is_current
        description: TRUE for the reservation's latest known status.
        tests:
          - not_null
          # quote: false so it renders as `in (true, false)` — a BOOL column can't be compared
          # to quoted strings on BigQuery, that would error
          - accepted_values:
              values: [true, false]
              quote: false
    # one interval can start per reservation per day. if this fails, LEAD builds overlapping
    # intervals. the source test on (reservation_id, snapshot_date) already prevents same-day dupes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - reservation_id
            - valid_from
