version: 2

# MetricFlow semantic model + metrics over fct_payments. Metrics are defined once here and
# compiled at query time, so every BI tool gets the same "revenue" number instead of re-deriving
# it. Sketch only — not run against a live warehouse. Full write-up in semantic_layer.md.

semantic_models:
  - name: payments
    description: One row per payment (final resolved status).
    model: ref('fct_payments')

    defaults:
      agg_time_dimension: initiated_at   # default time axis, so "revenue by month" just works

    entities:
      - name: payment
        type: primary                    # one row per payment -> count means distinct payments
        expr: payment_key
      - name: reservation                # fk, to join a reservation model later
        type: foreign
        expr: reservation_id

    dimensions:
      # ways to slice the metrics. final_status is here because the filters below reference it.
      - name: initiated_at
        type: time
        type_params:
          time_granularity: day
      - name: company_id
        type: categorical
      - name: payment_policy             # pay_now vs pay_later
        type: categorical
      - name: payment_method
        type: categorical
      - name: final_status
        type: categorical

    measures:
      # raw aggregations. the revenue filter lives on the metric, not here, so one measure
      # can back several metrics.
      - name: payment_amount
        agg: sum
        expr: amount_usd
      - name: payments_made
        agg: count
        expr: payment_key

metrics:
  # revenue = succeeded only (refunds, failed, unpaid BNPL all excluded). the one place this is decided.
  - name: total_revenue
    label: "Total Revenue"
    type: simple
    type_params:
      measure: payment_amount
    filter: "{{ Dimension('payment__final_status') }} = 'succeeded'"

  - name: payment_count                  # all attempts, no filter
    label: "Payment Count"
    type: simple
    type_params:
      measure: payments_made

  - name: failed_payment_count           # feeds failed_payment_rate; shares payments_made with the count above
    label: "Failed Payment Count"
    type: simple
    type_params:
      measure: payments_made
    filter: "{{ Dimension('payment__final_status') }} = 'failed'"

  # a ratio of the two metrics above, not a raw AVG(amount_usd) — that way it can't drift from the
  # revenue definition. numerator is succeeded revenue, denominator is all attempts, so this is
  # "revenue per attempt"; swap the denominator if the business wants avg of successful payments only.
  - name: avg_payment_value
    label: "Average Payment Value"
    type: ratio
    type_params:
      numerator: total_revenue
      denominator: payment_count

  - name: failed_payment_rate            # reuses payment_count, so it stays consistent with the count metric
    label: "Failed Payment Rate"
    type: ratio
    type_params:
      numerator: failed_payment_count
      denominator: payment_count
