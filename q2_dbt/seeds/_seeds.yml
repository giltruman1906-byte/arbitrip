version: 2

# Seeds standing in for the two raw BigQuery tables. In prod they're real ingested tables; here
# they're CSVs so the project runs end to end. sources.yml points staging at them via source(),
# so the model SQL reads the same as it would in prod. Run dbt seed before dbt run.
#
# Types are pinned rather than left to CSV inference:
#  - amount_usd stays FLOAT64 (raw fidelity); staging casts it to NUMERIC, where money belongs.
#  - payment_id is STRING so the empty field on the unresolved payment loads right. dbt-bigquery may
#    load an empty CSV value as '' not NULL, so staging applies NULLIF(payment_id, '').
#  - id / *_at / snapshot_date pinned so keys and timestamps aren't guessed (a mis-typed timestamp
#    would quietly break the incremental predicate).

seeds:
  - name: raw_payments
    description: >
      Simulated raw payment interactions. One payment spans 2-3 rows (initiation -> callback ->
      resolution). id is unique per row; payment_id is provider-assigned and back-filled onto all
      rows of a payment once known, so it's NULL only for payments that never resolved.
    config:
      column_types:
        id: STRING
        payment_id: STRING
        reservation_id: STRING
        action: STRING
        status: STRING
        amount_usd: FLOAT64
        payment_method: STRING
        payment_policy: STRING
        created_at: TIMESTAMP
        updated_at: TIMESTAMP

  - name: raw_reservations
    description: >
      Simulated daily snapshot of active reservations. In prod the real table is overwritten nightly
      (no history). Here we keep several snapshot_dates so transitions can be reconstructed — see
      stg_reservations and snapshot_limitations.md for why that reconstruction is lossy.
    config:
      column_types:
        reservation_id: STRING
        status: STRING
        company_id: STRING
        traveler_id: STRING
        amount_usd: FLOAT64
        snapshot_date: DATE
